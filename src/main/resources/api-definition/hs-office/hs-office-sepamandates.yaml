get:
    summary: Returns a list of (optionally filtered) SEPA Mandates.
    description: Returns the list of (optionally filtered) SEPA Mandates which are visible to the current subject or any of it's assumed roles.
    tags:
        - hs-office-sepaMandates
    operationId: getListOfSepaMandates
    parameters:
        - $ref: 'auth.yaml#/components/parameters/assumedRoles'
        - name: iban
          in: query
          required: false
          schema:
              type: string
          description: (Beginning of) IBAN to filter the results.
        - name: debitorUuid
          in: query
          required: false
          schema:
              type: string
              format: uuid
          description: UUID of the debitor whose SEPA Mandates are requested, exclusive to `debitorNumber`.
        - name: debitorNumber
          in: query
          required: false
          schema:
              type: string
              pattern: 'D-[0-9]{7}'
          description: Debitor number of the debitor whose SEPA Mandates are requested, exclusive to `debitorUuid`.
        - name: validAt
          in: query
          required: false
          schema:
              type: string
              format: date
          description: Key date, only SEPA Mandates whose validity contains this date are returned.
    responses:
        "200":
            description: OK
            content:
                'application/json':
                    schema:
                        type: array
                        items:
                            $ref: 'hs-office-sepamandate-schemas.yaml#/components/schemas/HsOfficeSepaMandate'
        "400":
            $ref: 'error-responses.yaml#/components/responses/BadRequest'
        "401":
            $ref: 'error-responses.yaml#/components/responses/Unauthorized'
        "403":
            $ref: 'error-responses.yaml#/components/responses/Forbidden'

post:
    summary: Adds a new SEPA Mandate.
    tags:
        - hs-office-sepaMandates
    operationId: postNewSepaMandate
    parameters:
        - $ref: 'auth.yaml#/components/parameters/assumedRoles'
    requestBody:
        description: A JSON object describing the new SEPA-Mandate.
        required: true
        content:
            application/json:
                schema:
                    $ref: 'hs-office-sepamandate-schemas.yaml#/components/schemas/HsOfficeSepaMandateInsert'
    responses:
        "201":
            description: Created
            content:
                'application/json':
                    schema:
                        $ref: 'hs-office-sepamandate-schemas.yaml#/components/schemas/HsOfficeSepaMandate'
        "401":
            $ref: 'error-responses.yaml#/components/responses/Unauthorized'
        "403":
            $ref: 'error-responses.yaml#/components/responses/Forbidden'
        "409":
            $ref: 'error-responses.yaml#/components/responses/Conflict'
