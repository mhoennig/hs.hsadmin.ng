
components:

    schemas:

        HsOfficeBankAccount:
            type: object
            properties:
                uuid:
                    type: string
                    format: uuid
                holder:
                    type: string
                iban:
                    type: string
                bic:
                    type: string
                bankName:
                    type: string
                    readOnly: true
                    description: |
                        The name of the bank, looked up in the bank directory by the country and bank code of the IBAN.
                        Empty for a bank which is not in the directory, which only happens outside Germany.
                issues:
                    $ref: '#/components/schemas/HsOfficeBankAccountIssues'

        HsOfficeBankAccountIssues:
            type: object
            description: Only present if the bank account has any issue.
            properties:
                bankDirectoryMismatch:
                    $ref: '#/components/schemas/HsOfficeBankAccountBankDirectoryMismatch'

        HsOfficeBankAccountBankDirectoryMismatch:
            type: object
            description: The German bank account does not match the bank directory, e.g. after an import of a new Bundesbank bank-code file.
            properties:
                reason:
                    type: string
                    enum:
                        - UNKNOWN_BANK_CODE
                        - BIC_MISMATCH
                bankCode:
                    type: string
                expectedBic:
                    type: string
                    description: The BIC of the bank directory; missing if the bank code is unknown.
            required:
                - reason
                - bankCode

        HsOfficeBankAccountInsert:
            type: object
            properties:
                holder:
                    type: string
                iban:
                    type: string
                bic:
                    type: string
                    description: |
                        For German IBANs, the BIC is looked up in the bank directory by the bank code of the IBAN;
                        if given, it has to match, if omitted, it gets completed.
                        For other IBANs, the BIC is required and only checked structurally unless overrideBankDirectory is set to true.
                overrideBankDirectory:
                    type: boolean
                    default: false
                    description: |
                        Lets the given BIC take precedence over the bank directory, e.g. if the bank code is missing or its BIC is outdated.
                        Only global admins can use this option.
            required:
                - holder
                - iban
            additionalProperties: false
