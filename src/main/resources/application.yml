server:
    port : 8080

management:
    server:
        port: 8081
        address: 127.0.0.1
    info:
        build:
            enabled: true
        git:
            enabled: true
            mode: full
    endpoints:
        web:
            exposure:
                # HOWTO: view _clickable_ Spring Actuator (Micrometer) Metrics endpoints:
                #   http://localhost:8081/actuator/metric-links

                # HOWTO: view all configured endpoints of the running application:
                #   http://localhost:8081/actuator/mappings

                # HOWTO: view the effective application configuration properties:
                #   http://localhost:8081/actuator/configprops

                include: info, health, metrics, metric-links, mappings, openapi, configprops, env
    endpoint:
        env:
            # TODO.spec: check this, maybe set to when_authorized?
            show-values: always
        configprops:
            # TODO.spec: check this, maybe set to when_authorized?
            show-values: always
    observations:
        annotations:
            enabled: true

spring:

    datasource:
        driver-class-name: org.postgresql.Driver
        password: password
        url: ${HSADMINNG_POSTGRES_JDBC_URL}
        username: postgres

    data:
        rest:
            # do NOT implicilty expose SpringData repositories as REST-controllers
            detection-strategy: annotated

    sql:
        init:
            mode: never

    jpa:
        properties:
            hibernate:
                dialect: net.hostsharing.hsadminng.config.PostgresCustomDialect

    liquibase:
        contexts: ${spring.profiles.active}

    security:
        oauth2:
            resourceserver:
                jwt:
                  issuer-uri: ${HSADMINNG_JWT_ISSUER:}
                  hmac-secret: ${HSADMINNG_JWT_HMAC_SECRET:}
                  audiences: ${HSADMINNG_JWT_AUDIENCE:}

# The hand-written API definitions carry the summaries and descriptions which get lost on the way
# through the generated controller interfaces, so Swagger UI reads them instead of /v3/api-docs;
# see DocumentationWebConfig for how they are served.
springdoc:
    swagger-ui:
        # must match the swagger-ui webjar pinned in build.gradle.kts, a mismatch yields 404;
        # enforced by the Gradle task verifySwaggerUiVersionPin (part of `check`)
        version: 5.32.11
        urls:
            - name: HS Office API
              url: /doc/api/spec/hs-office/hs-office.yaml
            - name: RBAC API
              url: /doc/api/spec/rbac/rbac.yaml
            - name: HS Booking API
              url: /doc/api/spec/hs-booking/hs-booking.yaml
            - name: HS Hosting API
              url: /doc/api/spec/hs-hosting/hs-hosting.yaml
            - name: HS Accounts API
              url: /doc/api/spec/accounts/api-paths.yaml
            - name: Root API
              url: /doc/api/spec/api-definition.yaml
            - name: as implemented (generated from controllers)
              url: /v3/api-docs

hsadminng:
    postgres:
        leakproof:
    cors:
        allowed-origins: ${ALLOWED_ORIGINS:*} # for compatibility with env-based CORS-configuration
    security:
        # SHA-256 hash (hex) of the API-key for provisioning the global-admin API_KEY subject,
        # e.g. generated via `printf '%s' "$apiKey" | sha256sum`, see ProvisioningApiKeyBootstrap
        provisioning-api-key-sha256: ${HSADMINNG_PROVISIONING_API_KEY_SHA256:}

metrics:
    distribution:
        percentiles-histogram:
            http:
                server:
                    requests: true

# HOWTO set logging-levels for certain Java packages (trace, debug, info, warn, error)
logging:
    level:
        org.springframework.security: info
#        org.springframework.web: DEBUG
#        org.hibernate.SQL: DEBUG # Enable SQL query logging
#        org.hibernate.orm.jdbc.bind: TRACE # Enable SQL parameter binding logging
#        org.springframework.web: DEBUG
#        org.springframework.web.method.annotation: DEBUG
#        org.springframework.validation: DEBUG
# HOWTO configure logging, e.g. logging to a separate file, see:
#   https://docs.spring.io/spring-boot/reference/features/logging.html

---

spring:
    config:
        activate:
            on-profile: fake-jwt
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: "http://localhost:${server.port}/fake-jwt"
                    jwk-set-uri: "http://localhost:${server.port}/fake-jwt/.well-known/jwks.json"
                    hmac-secret: ""
