
management:
    server:
        port: 8081
        address: 127.0.0.1
    endpoints:
        web:
            exposure:
                include: info, health, metrics, metric-links, mappings, openapi, swaggerui

spring:
    sql:
        init:
            platform: postgres

    datasource:
        url-tc: jdbc:tc:postgresql:17.7-trixie:///spring_boot_testcontainers
        url-tcx: jdbc:tc:postgresql:17.7-trixie:///spring_boot_testcontainers?TC_REUSABLE=true&TC_DAEMON=true
        url-local: jdbc:postgresql://localhost:5432/postgres
        url: ${spring.datasource.url-tc}
        username: postgres
        password: password
        hikari:
            # the tests run single-threaded per worker, but each cached context holds its own pool
            maximum-pool-size: 3

    jpa:
        properties:
            hibernate:
                default_schema: public
                dialect: net.hostsharing.hsadminng.config.PostgresCustomDialect
                format_sql: false
        hibernate:
            ddl-auto: none
        show-sql: false

    test:
        database:
            replace: none

    liquibase:
        change-log: classpath:/db/changelog/db.changelog-master.yaml
        contexts: tc,test,dev,pg_stat_statements
        parameters:
            "[HSADMINNG_POSTGRES_ADMIN_USERNAME]": ${HSADMINNG_POSTGRES_ADMIN_USERNAME:admin}
            "[HSADMINNG_POSTGRES_RESTRICTED_USERNAME]": ${HSADMINNG_POSTGRES_RESTRICTED_USERNAME:restricted}

# this file shadows src/main/resources/application.yml on the test classpath, thus the
# swagger-ui version pin has to be repeated here; enforced by verifySwaggerUiVersionPin
springdoc:
    swagger-ui:
        version: 5.32.11

hsadminng:
    fake-jwt:
        client-hosts: "localhost, 127.0.0.1, [::1]"

logging:
    level:
        liquibase: WARN
        net.ttddyy.dsproxy.listener: WARN # HOWTO: set to DEBUG to log meaningful SQL statements
        # just for the case there are problems with Testcontainers/Docker integration
        # org.testcontainers: DEBUG
        # com.github.dockerjava: DEBUG
        # org.springframework.security: DEBUG

testcontainers:
    network:
        mode: host

---

spring:
    config:
        activate:
            on-profile: fake-jwt
    security:
        oauth2:
            resourceserver:
                jwt:
                    # tests run on a random port, so the issuer only serves as a stable base for the fake OIDC URLs
                    issuer-uri: "http://localhost:8080/fake-jwt"
